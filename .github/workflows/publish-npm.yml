name: Publish to npm

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave blank to auto-detect from latest Git tag)'
        required: false
        type: string

jobs:
  publish:
    name: Build and Publish to npm
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          npm install
          npm run ui:install

      - name: Determine and sync package version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_FULL: ${{ github.ref }}
          GITHUB_REF_NAME_VAL: ${{ github.ref_name }}
        run: |
          VERSION=""

          # 1. If manually provided via workflow_dispatch input
          if [ -n "$INPUT_VERSION" ]; then
            INPUT_VER="$INPUT_VERSION"
            VERSION="${INPUT_VER#v}"
            echo "Using version from workflow input: $VERSION"

          # 2. If triggered by a Git tag push (e.g. refs/tags/v1.0.24)
          elif [[ "$GITHUB_REF_FULL" == refs/tags/v* ]]; then
            TAG_NAME="$GITHUB_REF_NAME_VAL"
            VERSION="${TAG_NAME#v}"
            echo "Using version from tag push: $VERSION"

          # 3. If triggered on a branch (e.g. main) via workflow_dispatch without input,
          #    auto-detect the latest Git tag
          else
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -n "$LATEST_TAG" ]; then
              VERSION="${LATEST_TAG#v}"
              echo "Auto-detected latest tag from Git: $VERSION (from $LATEST_TAG)"
            fi
          fi

          # Apply version if detected
          if [ -n "$VERSION" ]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid semver version: $VERSION"
              exit 1
            fi
            echo "Syncing package.json version to: $VERSION"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          else
            echo "Could not determine version from tag; keeping package.json version: $(node -p "require('./package.json').version")"
          fi

      - name: Build Web Dashboard and Serverfull bundle
        run: npm run build:serverfull

      - name: Publish package to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
